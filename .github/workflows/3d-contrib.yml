name: GitHub 3D Contribution Graph

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Abdelbari-Kecita
      - name: Commit & Push
        run: |
          git config user.email "abdelbari.m.kecita@gmail.com"
          git config user.name "Abdelbari-Kecita"
          git add -A .
          git commit -m "Generate 3D contribution graph"
          git push
